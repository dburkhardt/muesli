<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B85F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bowl - outer curve -->
  <path d="M 45 130 Q 45 170, 100 175 Q 155 170, 155 130" 
        fill="none" 
        stroke="url(#gradient)" 
        stroke-width="10" 
        stroke-linecap="round"/>
  
  <!-- Bowl - inner curve for depth -->
  <path d="M 55 135 Q 55 160, 100 163 Q 145 160, 145 135" 
        fill="none" 
        stroke="url(#gradient)" 
        stroke-width="8" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <!-- Waveform bars (muesli pieces) - more varied heights -->
  <!-- Leftmost bar -->
  <rect x="58" y="95" width="9" height="40" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Second from left -->
  <rect x="73" y="75" width="9" height="60" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Center tall bar -->
  <rect x="88" y="50" width="9" height="85" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Second from right -->
  <rect x="103" y="70" width="9" height="65" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Rightmost bar -->
  <rect x="118" y="85" width="9" height="50" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Additional thin bar on far left -->
  <rect x="133" y="95" width="9" height="40" rx="4.5" fill="url(#gradient)"/>
  
  <!-- Dots/berries floating above - mix of filled and outlined -->
  <!-- Small filled dot left -->
  <circle cx="50" cy="75" r="3.5" fill="url(#gradient)" opacity="0.85"/>
  
  <!-- Outlined circle left-center -->
  <circle cx="65" cy="60" r="5" fill="none" stroke="url(#gradient)" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Outlined circle top center -->
  <circle cx="88" cy="38" r="6" fill="none" stroke="url(#gradient)" stroke-width="3" opacity="0.9"/>
  
  <!-- Large outlined circle right-center -->
  <circle cx="118" cy="45" r="7" fill="none" stroke="url(#gradient)" stroke-width="3" opacity="0.9"/>
  
  <!-- Medium outlined circle right -->
  <circle cx="135" cy="60" r="5.5" fill="none" stroke="url(#gradient)" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Small filled dot right -->
  <circle cx="148" cy="78" r="4" fill="url(#gradient)" opacity="0.85"/>
</svg>
