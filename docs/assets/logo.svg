<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bowl -->
  <path d="M 40 120 Q 40 180, 100 180 Q 160 180, 160 120" 
        fill="none" 
        stroke="url(#gradient)" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Inner bowl line -->
  <path d="M 50 130 Q 50 170, 100 170 Q 150 170, 150 130" 
        fill="none" 
        stroke="url(#gradient)" 
        stroke-width="6" 
        stroke-linecap="round"
        opacity="0.7"/>
  
  <!-- Waveform/muesli pieces (vertical rounded rectangles) -->
  <!-- Left piece -->
  <rect x="55" y="80" width="10" height="50" rx="5" fill="url(#gradient)"/>
  
  <!-- Left-center piece -->
  <rect x="72" y="55" width="10" height="75" rx="5" fill="url(#gradient)"/>
  
  <!-- Center tall piece -->
  <rect x="89" y="35" width="10" height="95" rx="5" fill="url(#gradient)"/>
  
  <!-- Right-center piece -->
  <rect x="106" y="60" width="10" height="70" rx="5" fill="url(#gradient)"/>
  
  <!-- Right piece -->
  <rect x="123" y="75" width="10" height="55" rx="5" fill="url(#gradient)"/>
  
  <!-- Dots/berries above -->
  <circle cx="50" cy="60" r="4" fill="url(#gradient)" opacity="0.8"/>
  <circle cx="65" cy="45" r="5" fill="none" stroke="url(#gradient)" stroke-width="3"/>
  <circle cx="85" cy="25" r="6" fill="none" stroke="url(#gradient)" stroke-width="3"/>
  <circle cx="110" cy="50" r="5" fill="none" stroke="url(#gradient)" stroke-width="3"/>
  <circle cx="130" cy="40" r="7" fill="none" stroke="url(#gradient)" stroke-width="3"/>
  <circle cx="145" cy="65" r="5" fill="url(#gradient)" opacity="0.8"/>
</svg>
