name: CI

on:
  # Run on all pull requests
  pull_request:
    branches:
      - main
  
  # Run on push to main (after merge)
  push:
    branches:
      - main
  
  # Nightly builds at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

env:
  XCODE_VERSION: '26.2'

jobs:
  test:
    name: Build and Test
    runs-on: macos-26
    
    # Job-level env vars from secrets (for use in step conditions)
    env:
      SIGNING_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Preflight - Verify signing secrets
        run: |
          MISSING=""
          if [ -z "$SIGNING_CERT_P12" ]; then MISSING="$MISSING DEVELOPER_ID_CERT_P12"; fi
          if [ -z "$SIGNING_CERT_PASSWORD" ]; then MISSING="$MISSING DEVELOPER_ID_CERT_PASSWORD"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "CI builds require Developer ID signing for consistent app identity."
            echo "External contributor PRs from forks will fail (no access to signing secrets)."
            exit 1
          fi
          echo "✅ All signing secrets present"
      
      - name: Setup code signing certificates
        run: |
          echo "Setting up code signing certificates..."
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Decode and import certificate
          echo "$SIGNING_CERT_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # Set keychain for codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          echo "✅ Code signing certificates configured"
      
      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/Muesli-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build Muesli (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Debug \
            -destination 'platform=macOS' \
            build 2>&1 | tee /tmp/build-debug.log | xcpretty
      
      - name: Run tests with coverage
        run: |
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData \
            test 2>&1 | tee /tmp/test.log | xcpretty
      
      - name: Generate coverage report
        run: |
          # Find the coverage file
          COVERAGE_FILE=$(find DerivedData -name "*.xcresult" | head -1)
          
          if [ -z "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"
            exit 0
          fi
          
          echo "✅ Found coverage file: $COVERAGE_FILE"
          
          # Export coverage to LCOV format
          xcrun xccov view --report --json "$COVERAGE_FILE" > coverage.json
          
          # Convert to LCOV format using a simple script
          python3 << 'PYTHON_SCRIPT' > coverage.lcov || echo "⚠️ LCOV conversion failed, uploading JSON"
          import json
          
          with open('coverage.json', 'r') as f:
              data = json.load(f)
          
          print('TN:')
          for target in data.get('targets', []):
              for file_data in target.get('files', []):
                  path = file_data.get('path', '')
                  if not path or 'Test' in path:
                      continue
                  print(f'SF:{path}')
                  for func in file_data.get('functions', []):
                      line = func.get('lineNumber', 0)
                      exec_count = func.get('executionCount', 0)
                      print(f'DA:{line},{exec_count}')
                  print('end_of_record')
          PYTHON_SCRIPT
          
          echo "✅ Coverage report generated"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov,./coverage.json
          flags: unittests
          name: muesli-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Check for build warnings
        run: |
          if grep -i "warning:" /tmp/build-debug.log; then
            echo "⚠️ Build contains warnings (see above)"
            exit 0  # Don't fail on warnings, just report them
          else
            echo "✅ No build warnings"
          fi
      
      - name: Verify signing identity
        run: |
          echo "Signing identities in keychain:"
          security find-identity -v -p codesigning | grep "Developer ID" || echo "No Developer ID found"

  lint:
    name: Swift Lint
    runs-on: macos-26
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: |
          if [ -f .swiftlint.yml ]; then
            swiftlint lint --strict
          else
            echo "ℹ️ No .swiftlint.yml found, skipping lint"
          fi
        continue-on-error: true  # Advisory only - violations reported but don't block merges
                                 # TODO: Remove after baseline cleanup (track in plans/todo.md)

  build-release:
    name: Build Release Configuration
    runs-on: macos-26
    
    # Job-level env vars from secrets (for use in step conditions)
    env:
      SIGNING_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
      
      - name: Preflight - Verify signing secrets
        run: |
          MISSING=""
          if [ -z "$SIGNING_CERT_P12" ]; then MISSING="$MISSING DEVELOPER_ID_CERT_P12"; fi
          if [ -z "$SIGNING_CERT_PASSWORD" ]; then MISSING="$MISSING DEVELOPER_ID_CERT_PASSWORD"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "CI builds require Developer ID signing for consistent app identity."
            echo "External contributor PRs from forks will fail (no access to signing secrets)."
            exit 1
          fi
          echo "✅ All signing secrets present"
      
      - name: Setup code signing certificates
        run: |
          echo "Setting up code signing certificates..."
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Decode and import certificate
          echo "$SIGNING_CERT_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # Set keychain for codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          
          echo "✅ Code signing certificates configured"
      
      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/Muesli-*/SourcePackages
          key: ${{ runner.os }}-spm-release-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
      
      - name: Build Muesli (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Release \
            -destination 'platform=macOS' \
            build 2>&1 | tee /tmp/build-release.log | xcpretty
      
      - name: Verify app bundle
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/Muesli-*/Build/Products/Release/Muesli.app -maxdepth 0 -type d | head -1)
          if [ -d "$APP_PATH" ]; then
            echo "✅ App bundle created at: $APP_PATH"
            ls -lh "$APP_PATH/Contents/MacOS/"
            codesign -dvvv "$APP_PATH" || true
          else
            echo "❌ App bundle not found"
            exit 1
          fi
      
      - name: Verify signing identity
        run: |
          echo "Signing identities in keychain:"
          security find-identity -v -p codesigning | grep "Developer ID" || echo "No Developer ID found"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, build-release]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release Build: ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.build-release.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ CI failed - please review the logs above" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All CI checks passed!" >> $GITHUB_STEP_SUMMARY
          fi
