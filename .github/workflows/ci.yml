name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Note: permissions controls GITHUB_TOKEN scopes only. Artifact upload/download
# uses a separate ACTIONS_RUNTIME_TOKEN injected by the runner; it does not
# require actions:write or any other GITHUB_TOKEN scope.
permissions:
  contents: read

env:
  XCODE_VERSION: '26.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-required-stable:
    name: Test Required Stable
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout code
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Xcode
        # maxim-lobanov/setup-xcode v1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift Package Manager dependencies
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Muesli-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache WebRTC XCFramework
        id: cache-webrtc
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: Muesli/Frameworks/webrtc_audio_processing.xcframework
          key: webrtc-v1.3-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('scripts/build-webrtc-aec.sh', 'scripts/cross_mac_*.txt') }}

      - name: Install WebRTC Build Dependencies
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config

      - name: Build WebRTC XCFramework
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: ./scripts/build-webrtc-aec.sh
        timeout-minutes: 25

      - name: Verify WebRTC XCFramework
        run: |
          echo "Checking XCFramework..."
          if [ -d "Muesli/Frameworks/webrtc_audio_processing.xcframework" ]; then
            lipo -info Muesli/Frameworks/webrtc_audio_processing.xcframework/macos-arm64_x86_64/*.a 2>/dev/null || echo "XCFramework present (architecture check skipped)"
            echo "✅ WebRTC XCFramework verified"
          else
            echo "⚠️ WebRTC XCFramework not found - WebRTC AEC will run in stub mode"
          fi

      - name: Run stable required tests with coverage
        run: |
          # Skip hardware-dependent and flaky tests. EchoCancellationServiceWebRTCTests
          # was previously quarantined (e9bd04c) and fails in CI; re-quarantine until fixed.
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath stable-tests.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:MuesliTests/CoreAudioTapHardwareTests \
            -skip-testing:MuesliTests/TapAudioCaptureServicePermissionTests \
            -skip-testing:MuesliTests/EchoCancellationServiceWebRTCTests \
            -skip-testing:MuesliTests/EchoCancellationServiceNLMSTests/testConcurrentAccess \
            test | tee stable-test.log | xcpretty

      - name: Append failed stable tests to summary
        if: failure()
        run: |
          {
            echo "## Stable required tests failed"
            echo ""
            if [ -f stable-test.log ]; then
              echo '```'
              grep -E "Test Case '-\\[|\\*\\* TEST FAILED \\*\\*|error:" stable-test.log | tail -n 80 || true
              echo '```'
            else
              echo "No stable-test.log found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stable test result bundle
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stable-tests-xcresult-${{ github.sha }}
          path: stable-tests.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Generate coverage report
        if: success()
        run: |
          COVERAGE_FILE="stable-tests.xcresult"
          if [ ! -d "$COVERAGE_FILE" ]; then
            echo "⚠️ No coverage file found"
            exit 0
          fi

          echo "✅ Found coverage file: $COVERAGE_FILE"
          xcrun xccov view --report --json "$COVERAGE_FILE" > coverage.json

          python3 << 'PYTHON_SCRIPT' > coverage.lcov || echo "⚠️ LCOV conversion failed, uploading JSON"
          import json

          with open('coverage.json', 'r') as f:
              data = json.load(f)

          print('TN:')
          for target in data.get('targets', []):
              for file_data in target.get('files', []):
                  path = file_data.get('path', '')
                  if not path or 'Test' in path:
                      continue
                  print(f'SF:{path}')
                  for func in file_data.get('functions', []):
                      line = func.get('lineNumber', 0)
                      exec_count = func.get('executionCount', 0)
                      print(f'DA:{line},{exec_count}')
                  print('end_of_record')
          PYTHON_SCRIPT

      - name: Upload coverage to Codecov
        if: success()
        # codecov/codecov-action v5
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: ./coverage.lcov,./coverage.json
          flags: unittests
          name: muesli-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-quarantined:
    name: Test Quarantined
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.'))
    runs-on: macos-26
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout code
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Xcode
        # maxim-lobanov/setup-xcode v1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift Package Manager dependencies
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Muesli-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache WebRTC XCFramework
        id: cache-webrtc-quarantined
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: Muesli/Frameworks/webrtc_audio_processing.xcframework
          key: webrtc-v1.3-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('scripts/build-webrtc-aec.sh', 'scripts/cross_mac_*.txt') }}

      - name: Install WebRTC Build Dependencies
        if: steps.cache-webrtc-quarantined.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config

      - name: Build WebRTC XCFramework
        if: steps.cache-webrtc-quarantined.outputs.cache-hit != 'true'
        run: ./scripts/build-webrtc-aec.sh
        timeout-minutes: 25

      - name: Run quarantined tests (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath quarantined-tests.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MuesliTests/CoreAudioTapHardwareTests \
            -only-testing:MuesliTests/TapAudioCaptureServicePermissionTests \
            -only-testing:MuesliTests/EchoCancellationServiceWebRTCTests \
            test | tee quarantined-test.log | xcpretty

      - name: Append quarantined test failures to summary
        if: always()
        run: |
          if grep -q "\\*\\* TEST FAILED \\*\\*" quarantined-test.log 2>/dev/null; then
            {
              echo "## Quarantined tests failed (informational)"
              echo ""
              echo '```'
              grep -E "Test Case '-\\[|\\*\\* TEST FAILED \\*\\*|error:" quarantined-test.log | tail -n 80 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quarantined test result bundle
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: quarantined-tests-xcresult-${{ github.sha }}
          path: quarantined-tests.xcresult
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Swift Lint Changed Files (Informational)
    runs-on: macos-26
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout code
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Determine changed Swift files
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE="${AFTER}~1...${AFTER}"
            else
              DIFF_RANGE="${BEFORE}...${AFTER}"
            fi
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          echo "Using diff range: ${DIFF_RANGE}"
          FILES=$(git diff --name-only --diff-filter=ACMR "${DIFF_RANGE}" | grep -E '\.swift$' || true)

          VALID_FILES=""
          if [ -n "$FILES" ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                VALID_FILES="${VALID_FILES}${file}"$'\n'
              fi
            done <<< "$FILES"
          fi

          if [ -z "$VALID_FILES" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed Swift files; strict lint passes by policy."
            echo "## Lint" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No changed Swift files detected; strict changed-files lint not required for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              printf "%s" "$VALID_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run strict SwiftLint on changed files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Linting $file"
            swiftlint lint --strict "$file" || true
          done <<< "${{ steps.changed.outputs.files }}"

  build-release:
    name: Build Release Configuration
    # Intentionally runs on ALL events including pull_request (P1-4).
    # Validates that the Release configuration compiles on PRs before merge.
    # Fingerprint generation/upload is skipped on PRs via step-level guards
    # (github.event_name != 'pull_request') to avoid merge-commit SHA issues.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout code
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Xcode
        # maxim-lobanov/setup-xcode v1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift Package Manager dependencies
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Muesli-*/SourcePackages
          key: ${{ runner.os }}-spm-release-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-

      - name: Cache WebRTC XCFramework
        id: cache-webrtc-release
        # actions/cache v5
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: Muesli/Frameworks/webrtc_audio_processing.xcframework
          key: webrtc-v1.3-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('scripts/build-webrtc-aec.sh', 'scripts/cross_mac_*.txt') }}

      - name: Install WebRTC Build Dependencies
        if: steps.cache-webrtc-release.outputs.cache-hit != 'true'
        run: brew install meson ninja pkg-config

      - name: Build WebRTC XCFramework
        if: steps.cache-webrtc-release.outputs.cache-hit != 'true'
        run: ./scripts/build-webrtc-aec.sh
        timeout-minutes: 25

      - name: Verify WebRTC XCFramework
        run: |
          echo "Checking XCFramework..."
          if [ -d "Muesli/Frameworks/webrtc_audio_processing.xcframework" ]; then
            lipo -info Muesli/Frameworks/webrtc_audio_processing.xcframework/macos-arm64_x86_64/*.a 2>/dev/null || echo "XCFramework present (architecture check skipped)"
            echo "✅ WebRTC XCFramework verified"
          else
            echo "⚠️ WebRTC XCFramework not found - WebRTC AEC will run in stub mode"
          fi

      - name: Fingerprint WebRTC AEC dependency
        id: webrtc-fingerprint-release
        if: github.event_name != 'pull_request'
        run: |
          XCFW_DIR="Muesli/Frameworks/webrtc_audio_processing.xcframework"
          if [ -d "$XCFW_DIR" ]; then
            FINGERPRINT=$(find "$XCFW_DIR" -name "*.a" | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
            echo "WebRTC AEC Fingerprint (build-release job): ${FINGERPRINT}"
            echo "fingerprint=${FINGERPRINT}" >> $GITHUB_OUTPUT
            echo "{\"fingerprint\": \"${FINGERPRINT}\", \"workflow\": \"ci-build-release\", \"ref\": \"${GITHUB_REF}\", \"sha\": \"${GITHUB_SHA}\"}" > webrtc-fingerprint-ci.json
          else
            echo "fingerprint=none" >> $GITHUB_OUTPUT
            echo "⚠️ XCFramework not present, fingerprint skipped"
          fi

      - name: Upload WebRTC fingerprint artifact
        if: github.event_name != 'pull_request' && steps.webrtc-fingerprint-release.outputs.fingerprint != 'none'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: webrtc-fingerprint-ci-${{ github.sha }}
          path: webrtc-fingerprint-ci.json
          retention-days: 30

      - name: Build Muesli (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project Muesli.xcodeproj \
            -scheme Muesli \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Verify app bundle
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/Muesli-*/Build/Products/Release/Muesli.app -maxdepth 0 -type d | head -1)
          if [ -d "$APP_PATH" ]; then
            echo "✅ App bundle created at: $APP_PATH"
            ls -lh "$APP_PATH/Contents/MacOS/"
            codesign -dvvv "$APP_PATH" || true
          else
            echo "❌ App bundle not found"
            exit 1
          fi

      - name: Verify AEC policy guards
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/Muesli-*/Build/Products/Release/Muesli.app -maxdepth 0 -type d | head -1)
          BINARY="$APP_PATH/Contents/MacOS/Muesli"
          FAIL=0

          if strings "$BINARY" | grep -q "aecDebugForceOff"; then
            echo "❌ Release binary contains aecDebugForceOff debug key"
            FAIL=1
          else
            echo "✅ No debug AEC override in Release binary"
          fi

          for FIELD in "aecStoredPref=" "aecEffective="; do
            if ! grep -q "$FIELD" Muesli/Services/TapAudioCaptureService.swift; then
              echo "❌ Missing $FIELD in TapAudioCaptureService logging"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✅ AEC log fields present in source"

          if ! grep -q "resolveAECStartupPolicy" Muesli/Managers/PreferencesManager.swift; then
            echo "❌ resolveAECStartupPolicy missing from PreferencesManager"
            FAIL=1
          else
            echo "✅ AEC startup policy function present"
          fi

          if ! grep -q "testAECPolicy_Matrix" MuesliTests/PreferencesManagerTests.swift; then
            echo "❌ testAECPolicy_Matrix missing from PreferencesManagerTests"
            FAIL=1
          else
            echo "✅ AEC policy matrix test present"
          fi

          [ $FAIL -ne 0 ] && exit 1
          echo "✅ All AEC policy guards passed"

      - name: Build PR preview DMG (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          # Get version from Version.xcconfig
          VERSION=$(grep "MARKETING_VERSION" Version.xcconfig | cut -d '=' -f2 | xargs)
          echo "Version: ${VERSION}"

          # Locate the app built in the previous step
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/Muesli-*/Build/Products/Release/Muesli.app -maxdepth 0 -type d 2>/dev/null | head -1)
          if [ ! -d "${APP_PATH}" ]; then
            echo "❌ App bundle not found for DMG packaging"
            exit 1
          fi
          echo "App path: ${APP_PATH}"

          # Install create-dmg
          brew install create-dmg

          # Assemble a staging directory
          STAGING=$(mktemp -d)
          cp -R "${APP_PATH}" "${STAGING}/"

          DMG_NAME="Muesli-v${VERSION}-pr${{ github.event.number }}-preview.dmg"

          create-dmg \
            --volname "Muesli" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 128 \
            --icon "Muesli.app" 200 190 \
            --hide-extension "Muesli.app" \
            --app-drop-link 600 185 \
            --no-internet-enable \
            "${DMG_NAME}" \
            "${STAGING}"

          rm -rf "${STAGING}"

          SIZE_MB=$(du -m "${DMG_NAME}" | cut -f1)
          SHA=$(shasum -a 256 "${DMG_NAME}" | awk '{print $1}')
          echo "✅ PR preview DMG created: ${DMG_NAME} (${SIZE_MB}MB)"
          echo "SHA-256: ${SHA}"

          # Stash path for upload step
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

          {
            echo "## PR Preview DMG"
            echo ""
            echo "**File:** \`${DMG_NAME}\`"
            echo "**Size:** ${SIZE_MB} MB"
            echo "**SHA-256:** \`${SHA}\`"
            echo ""
            echo "> ⚠️ Unsigned build — right-click → Open to bypass Gatekeeper on first launch."
            echo ""
            echo "Download from the **Artifacts** section of this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR preview DMG artifact
        if: github.event_name == 'pull_request'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr-preview-dmg-${{ github.event.number }}-${{ github.sha }}
          path: ${{ env.DMG_NAME }}
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-required-stable, test-quarantined, lint, build-release]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable tests (required): ${{ needs.test-required-stable.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint (informational): ${{ needs.lint.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release build (required): ${{ needs.build-release.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quarantined tests (informational): ${{ needs.test-quarantined.result }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.test-required-stable.result }}" == "failure" || "${{ needs.build-release.result }}" == "failure" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Required CI checks failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Required CI checks passed." >> "$GITHUB_STEP_SUMMARY"
