<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="720" fill="#f5f5f7"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#e5e5ea;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  
  <!-- App icon placeholder (left side) -->
  <g transform="translate(280, 250)">
    <!-- Icon shadow -->
    <circle cx="80" cy="85" r="75" fill="#000000" opacity="0.1"/>
    <!-- Icon background -->
    <circle cx="80" cy="80" r="75" fill="#007AFF"/>
    <!-- Waveform icon (simplified) -->
    <g transform="translate(40, 50)">
      <rect x="10" y="20" width="8" height="40" rx="4" fill="#ffffff"/>
      <rect x="25" y="10" width="8" height="60" rx="4" fill="#ffffff"/>
      <rect x="40" y="25" width="8" height="30" rx="4" fill="#ffffff"/>
      <rect x="55" y="5" width="8" height="70" rx="4" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Arrow (center) -->
  <g transform="translate(600, 320)">
    <path d="M 0,0 L 80,0 L 80,-20 L 120,30 L 80,80 L 80,60 L 0,60 Z" fill="#8E8E93" opacity="0.4"/>
  </g>
  
  <!-- Applications folder icon (right side) -->
  <g transform="translate(820, 250)">
    <!-- Folder shadow -->
    <rect x="5" y="85" width="150" height="120" rx="8" fill="#000000" opacity="0.1"/>
    <!-- Folder -->
    <rect x="0" y="80" width="150" height="120" rx="8" fill="#5AC8FA"/>
    <!-- Folder tab -->
    <path d="M 0,80 L 50,80 L 60,65 L 150,65 L 150,80 Z" fill="#5AC8FA"/>
    <!-- "A" for Applications -->
    <text x="75" y="155" font-family="SF Pro Display, -apple-system, system-ui" font-size="60" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>
  </g>
  
  <!-- Tagline -->
  <text x="640" y="480" font-family="SF Pro Display, -apple-system, system-ui" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="middle">
    Muesli
  </text>
  <text x="640" y="520" font-family="SF Pro Text, -apple-system, system-ui" font-size="20" font-weight="400" fill="#6e6e73" text-anchor="middle">
    On-device meeting transcription for macOS
  </text>
  
  <!-- Installation instruction -->
  <text x="640" y="590" font-family="SF Pro Text, -apple-system, system-ui" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">
    Drag Muesli to Applications folder to install
  </text>
</svg>
