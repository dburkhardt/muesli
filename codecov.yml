# Codecov Configuration for Muesli
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    # Overall project coverage
    project:
      default:
        target: 70%
        threshold: 1%
        if_ci_failed: error
    
    # Coverage for changes in PR (diff coverage)
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

# Ignore patterns - exclude files that don't need coverage
ignore:
  - "MuesliTests/**/*"
  - "MuesliUITests/**/*"
  - "**/Mocks/**/*"
  - "**/Preview Content/**/*"
  - "**/*.xcscheme"
  - "**/*.xcconfig"
  - "**/Info.plist"
  - "scripts/**/*"
  - "docs/**/*"
  - "assets/**/*"
  - "Muesli/Views/**/*"

# Comment configuration for PRs
comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# GitHub integration
github_checks:
  annotations: true

# Flags for different test types
flags:
  unittests:
    paths:
      - Muesli/
    carryforward: true
